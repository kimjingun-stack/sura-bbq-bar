name: Brand profile validation
on:
  pull_request:
  push:
    branches: [feature/profile-v2]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:i18n
      - run: npm run check:facts
      - run: npm run build
      - run: npm test
